name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan_ruby:
    name: Security Scan (Brakeman)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman security scan
        run: |
          echo "🛡️ Running Brakeman security scan..."
          bin/brakeman --no-pager --exit-on-warn --format plain

  lint:
    name: Lint (RuboCop)
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run RuboCop linter
        run: |
          echo "🎨 Running RuboCop code style check..."
          bin/rubocop -f github

  test:
    name: Test Suite (Rails Test)
    runs-on: self-hosted

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: |
          echo "🗄️ Preparing test database..."
          bin/rails db:test:prepare

      - name: Run tests
        env:
          RAILS_ENV: test
        run: |
          echo "🧪 Running test suite..."
          bin/rails test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [scan_ruby, lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build image
        run: |
          echo "Building tcdd-app-be image... 🏗"
          docker build -t tcdd-app-image .
  
      - name: Deploy image
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          echo "Deploying tcdd-app-be image 🚀"
          docker stop tcdd-app || true && docker rm tcdd-app || true
          docker network ls
          docker ps -a
          docker run -d -e "SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}" \
                     -e "RAILS_ENV=production" \
                     --net tcdd-net --ip 172.43.0.10 \
                     -v tcdd-app-data:/rails/db/production.sqlite3 \
                     -v tcdd-app-data:/rails/storage \
                     --name tcdd-app tcdd-app-image