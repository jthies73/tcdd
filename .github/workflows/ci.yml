name: CI

# push to main      → staging    (image tag :staging, /opt/tcdd-staging)
# published release → production (image tags :<version> + :latest, /opt/tcdd)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tcdd
  IS_RELEASE: ${{ github.event_name == 'release' }}

jobs:
  scan_ruby:
    name: Security Scan (Brakeman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/brakeman --no-pager

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rubocop -f github

  test:
    name: Test Suite (Rails Test)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bin/rails db:test:prepare
      - run: bin/rails test:all

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  build:
    name: Build & Push
    if: github.event_name != 'pull_request'
    needs: [ scan_ruby, lint, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=staging,enable=${{ env.IS_RELEASE != 'true' }}
            type=semver,pattern={{version}},enable=${{ env.IS_RELEASE }}
            type=raw,value=latest,enable=${{ env.IS_RELEASE }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_IP: ${{ secrets.VPS_IP }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_USER: ${{ github.actor }}
          SECRET_KEY_BASE: ${{ env.IS_RELEASE == 'true' && secrets.SECRET_KEY_BASE || secrets.STAGING_SECRET_KEY_BASE }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COMPOSE_FILE: ${{ env.IS_RELEASE == 'true' && 'docker-compose.yml' || 'docker-compose.staging.yml' }}
          DEPLOY_PATH: ${{ env.IS_RELEASE == 'true' && '/opt/tcdd' || '/opt/tcdd-staging' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts

          # Ship this environment's compose file as docker-compose.yml.
          ssh "$VPS_USER@$VPS_IP" "sudo tee $DEPLOY_PATH/docker-compose.yml > /dev/null" < "$COMPOSE_FILE"

          # Runtime env the compose file expects (values over stdin, never in argv).
          # Single quotes stop compose from expanding $ in the password.
          printf "SECRET_KEY_BASE=%s\nADMIN_USERNAME='%s'\nADMIN_PASSWORD='%s'\n" \
            "$SECRET_KEY_BASE" "$ADMIN_USERNAME" "$ADMIN_PASSWORD" \
            | ssh "$VPS_USER@$VPS_IP" "sudo tee $DEPLOY_PATH/.env > /dev/null && sudo chmod 600 $DEPLOY_PATH/.env"

          # The VPS — not the runner — does the pull, so authenticate it to GHCR.
          echo "$GHCR_PAT" | ssh "$VPS_USER@$VPS_IP" \
            "sudo docker login ghcr.io -u $REGISTRY_USER --password-stdin"

          ssh "$VPS_USER@$VPS_IP" \
            "cd $DEPLOY_PATH && sudo docker compose pull && sudo docker compose up -d"
