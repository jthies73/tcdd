services:
  tcdd-staging:
    container_name: tcdd-staging
    image: ghcr.io/jthies73/tcdd:staging
    restart: always
    volumes:
      - ./storage:/rails/storage
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_ENV=staging
      - RAILS_LOG_LEVEL=debug
      - STAGING_HOST=tcdd.yafa.app

networks:
  default:
    name: web_proxy
    external: true
